<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Food Villa · Waiter</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14201b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FV Waiter">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2314201b'/><text x='32' y='43' font-family='Georgia,serif' font-size='30' fill='%23c9a45c' text-anchor='middle'>FV</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14201b; --ink-2: #1d2c25; --ink-3: #26382f; --line: rgba(255,255,255,.1);
    --gold: #c9a45c; --gold-soft: #e2cc9b; --green: #1f8a4c; --red: #c2412d;
    --text: #f3efe6; --muted: rgba(243,239,230,.6);
    --sans: "Inter", "Hind Siliguri", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--ink); color: var(--text); font: 15px/1.4 var(--sans); }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .app { max-width: 640px; margin: 0 auto; min-height: 100vh; padding-bottom: 96px; }
  [hidden] { display: none !important; }

  /* Top bar */
  .top { position: sticky; top: 0; z-index: 20; background: var(--ink); border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
  .bar h1 { font-size: 18px; margin: 0; flex: 1; }
  .bar h1 small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
  .chip { border: 1px solid var(--line); background: var(--ink-2); border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .back { border: 0; background: var(--ink-2); border-radius: 10px; width: 42px; height: 42px; font-size: 22px; line-height: 1; }

  /* Tables */
  .floor { padding: 16px 14px 4px; }
  .floor h2 { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin: 0 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 10px; }
  .tbl { position: relative; height: 72px; border-radius: 12px; border: 1px solid var(--line); background: var(--ink-2); font-size: 20px; font-weight: 700; display: grid; place-content: center; text-align: center; gap: 2px; }
  .tbl small { font-size: 11px; font-weight: 600; color: var(--muted); }
  .tbl.busy { border-color: var(--green); background: #173a29; }
  .tbl.busy small { color: #8fd8a8; }
  .tbl.draft { border-color: var(--gold); }
  .tbl .dot { position: absolute; top: 6px; right: 6px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--gold); color: var(--ink); font-size: 11px; display: grid; place-items: center; padding: 0 5px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; padding: 18px 14px 0; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

  /* Order screen */
  .search { padding: 0 14px 10px; }
  .search input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: #111; font-size: 16px; }
  .cats { display: flex; gap: 8px; overflow-x: auto; padding: 0 14px 12px; scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  .cats button { flex: none; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 8px 12px; font-size: 13px; color: var(--muted); }
  .sec { padding: 14px 14px 0; }
  .sec h3 { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin: 6px 0 2px; }
  .sec h4 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 12px 0 0; font-weight: 600; }
  .it { border-bottom: 1px solid var(--line); padding: 10px 0; }
  .it .row { display: flex; align-items: center; gap: 10px; }
  .it .nm { flex: 1; font-size: 15px; font-weight: 500; }
  .it .nm small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
  .veg { display: inline-block; width: 11px; height: 11px; border: 1.5px solid #3fa35b; border-radius: 2px; position: relative; margin-right: 6px; vertical-align: 0; }
  .veg::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; background: #3fa35b; }
  .veg.nv { border-color: var(--red); } .veg.nv::after { background: var(--red); }
  .qty { display: inline-flex; align-items: center; border-radius: 10px; overflow: hidden; border: 1px solid var(--gold); flex: none; }
  .qty button { width: 42px; height: 40px; border: 0; background: transparent; color: var(--gold-soft); font-size: 22px; font-weight: 600; }
  .qty .q { min-width: 26px; text-align: center; font-weight: 700; }
  .qty.add button.plus { width: auto; padding: 0 16px; font-size: 14px; letter-spacing: .04em; }
  .qty.add .minus, .qty.add .q { display: none; }
  .qty:not(.add) { background: var(--gold); }
  .qty:not(.add) button, .qty:not(.add) .q { color: var(--ink); }
  .notebtn { border: 1px dashed var(--line); background: transparent; border-radius: 10px; height: 40px; padding: 0 10px; font-size: 13px; color: var(--muted); flex: none; }
  .notebtn.has { border-style: solid; border-color: var(--gold-soft); color: var(--gold-soft); }
  .note { margin-top: 8px; display: grid; gap: 8px; }
  .note input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: #111; font-size: 15px; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; }
  .quick button { border: 1px solid var(--line); background: var(--ink-2); border-radius: 999px; padding: 6px 10px; font-size: 12px; }
  .it .shown-note { margin-top: 4px; font-size: 13px; color: var(--gold-soft); font-style: italic; }
  .none { text-align: center; color: var(--muted); padding: 40px 14px; }

  /* Bottom bar */
  .foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--ink) 30%); }
  .foot .in { max-width: 612px; margin: 0 auto; }
  .go { width: 100%; display: flex; align-items: center; gap: 12px; border: 0; border-radius: 14px; background: var(--green); color: #fff; padding: 14px 16px; font-size: 16px; font-weight: 700; text-align: left; }
  .go span { margin-left: auto; background: rgba(255,255,255,.16); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
  .go:disabled { background: var(--ink-3); color: var(--muted); }

  /* Review sheet */
  .sheet { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; }
  .sheet .box { width: 100%; max-width: 640px; max-height: 92vh; overflow: auto; background: var(--ink-2); border-radius: 18px 18px 0 0; padding: 16px 16px calc(18px + env(safe-area-inset-bottom)); }
  .sheet header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .sheet header h2 { margin: 0; font-size: 20px; }
  .x { border: 0; background: transparent; font-size: 28px; line-height: 1; color: var(--muted); padding: 4px 8px; }
  .line { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .line .nm { flex: 1; }
  .line .nm small { display: block; color: var(--gold-soft); font-style: italic; font-size: 12px; }
  .line .amt { min-width: 60px; text-align: right; font-weight: 600; }
  .tot { display: flex; justify-content: space-between; font-weight: 700; font-size: 17px; padding: 12px 0 4px; }
  .field { display: grid; gap: 6px; margin-top: 12px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .field input, .field textarea { padding: 11px 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: #111; font-size: 15px; text-transform: none; letter-spacing: 0; font-weight: 400; width: 100%; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .toggle { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 12px; border-radius: 10px; border: 1px solid var(--line); font-weight: 600; }
  .toggle input { width: 22px; height: 22px; accent-color: var(--gold); }
  .toggle small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
  .send { margin-top: 16px; }
  .hint { font-size: 12px; color: var(--muted); text-align: center; margin: 10px 0 0; }
  .prev { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 14px; }
  .prev h3 { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin: 0 0 6px; }
  .prev .p { font-size: 13px; color: var(--muted); padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .prev .p b { color: var(--text); }
  .btns { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .btn2 { flex: 1; border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 12px; font-weight: 600; font-size: 14px; }
  .btn2.warn { border-color: rgba(194,65,45,.6); color: #f0a497; }

  .toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); z-index: 80; background: var(--green); color: #fff; font-weight: 600; padding: 12px 18px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
</style>
</head>
<body>
<div class="app">

  <!-- ===== Screen 1: pick a table ===== -->
  <section id="vTables">
    <div class="top"><div class="bar">
      <h1><span data-t="title">Food Villa · Waiter</span><small id="today"></small></h1>
      <button class="chip" id="langBtn" type="button">বাংলা</button>
      <button class="chip" id="whoBtn" type="button"></button>
    </div></div>
    <div id="floors"></div>
    <div class="legend">
      <span><i style="background:#173a29;border:1px solid var(--green)"></i><span data-t="lgSent">Order sent (running total)</span></span>
      <span><i style="border:1px solid var(--gold)"></i><span data-t="lgDraft">Not sent yet</span></span>
    </div>
  </section>

  <!-- ===== Screen 2: take the order ===== -->
  <section id="vOrder" hidden>
    <div class="top">
      <div class="bar">
        <button class="back" id="backBtn" type="button" aria-label="Back to tables">‹</button>
        <h1 id="tblTitle"></h1>
        <button class="chip" id="tblInfo" type="button" hidden></button>
      </div>
      <div class="search"><input id="q" type="search" data-tp="search" placeholder="Search dish… e.g. chi, naan, momo" autocomplete="off"></div>
      <div class="cats" id="cats"></div>
    </div>
    <div id="list"></div>
  </section>

</div>

<div class="foot" id="foot" hidden><div class="in">
  <button class="go" id="goBtn" type="button"><b id="goCount">0 items</b><span id="goTot">Review ›</span></button>
</div></div>

<div class="sheet" id="sheet" hidden><div class="box">
  <header><h2 id="shTitle"></h2><button class="x" id="shClose" type="button" aria-label="Close">×</button></header>
  <div id="shLines"></div>
  <div id="newPart">
  <div class="tot"><span data-t="thisOrder">This order</span><span id="shTot"></span></div>
  <div class="row2">
    <label class="field"><span data-t="guests">Guests</span><input id="guests" type="number" min="1" max="60" inputmode="numeric" data-tp="optional" placeholder="optional"></label>
    <label class="field"><span data-t="gnote">Order note</span><input id="gnote" data-tp="gnoteP" placeholder="e.g. serve starters first"></label>
  </div>
  <label class="toggle"><input type="checkbox" id="addon"><span><span data-t="addon">Add-on to this table's earlier order</span><small data-t="addonS">Kitchen sees it marked as extra items</small></span></label>
  <button class="go send" id="sendBtn" type="button"><b data-t="send">Send to kitchen</b><span>WhatsApp ›</span></button>
  <p class="hint" data-t="hint">Opens the share menu: choose WhatsApp → your kitchen group.</p>
  </div>
  <div class="prev" id="prev" hidden>
    <h3 data-t="prev">Already sent for this table</h3>
    <div id="prevList"></div>
    <div class="tot"><span data-t="soFar">Table total so far</span><span id="prevTot"></span></div>
    <div class="btns">
      <button class="btn2" id="billBtn" type="button" data-t="bill">Send bill summary</button>
      <button class="btn2 warn" id="closeBtn" type="button" data-t="close">Close table (paid)</button>
    </div>
  </div>
</div></div>

<div class="toast" id="toast" hidden></div>

<script src="../menu.js?v=3"></script>
<script>
// ===================== SETTINGS =====================
// Tables on each floor. Change the numbers (or add a floor) to match the restaurant.
const FLOORS = [
  { name: 'Ground Floor', prefix: 'G', tables: 6 },
  { name: 'First Floor',  prefix: 'F', tables: 4 },
  { name: 'Hunter House', prefix: 'H', tables: 4 }
];
const EXTRA = ['Takeaway', 'Parcel'];            // non-table orders, shown as their own buttons
// Used only on phones/computers without a share menu: the order opens in a WhatsApp chat with this number.
const KITCHEN_PHONE = '918942804671';
const QUICK_NOTES = {
  en: ['Less spicy', 'Extra spicy', 'No onion', 'No garlic', 'Well done', 'Pack it'],
  bn: ['কম ঝাল', 'বেশি ঝাল', 'পেঁয়াজ ছাড়া', 'রসুন ছাড়া', 'ভালো করে রান্না', 'প্যাক করে দিন']
};

// ===================== LANGUAGE (English / বাংলা) =====================
// Dish names stay as printed on the menu. The screens follow the switch; kitchen tickets always carry both languages.
const TXT = {
  en: {
    title: 'Food Villa · Waiter', lgSent: 'Order sent (running total)', lgDraft: 'Not sent yet', search: 'Search dish… e.g. chi, naan, momo',
    thisOrder: 'This order', guests: 'Guests', optional: 'optional', gnote: 'Order note', gnoteP: 'e.g. serve starters first',
    addon: "Add-on to this table's earlier order", addonS: 'Kitchen sees it marked as extra items', send: 'Send to kitchen',
    hint: 'Opens the share menu: choose WhatsApp → your kitchen group.', prev: 'Already sent for this table', soFar: 'Table total so far',
    bill: 'Send bill summary', close: 'Close table (paid)', setName: 'Set your name', askName: 'Your name (shown to the kitchen):',
    other: 'Other', add: 'ADD', note: 'Note', noteP: 'Note for the kitchen', noMatch: q => `No dish matches “${q}”`,
    items: n => `${n} item${n > 1 ? 's' : ''}`, tapAdd: 'Tap ADD on a dish', review: 'Review ›', table: 'Table ', waiter: 'Waiter: ',
    noName: 'Tap 👤 on the tables screen to set your name', sentChip: 'Sent ', nothing: 'Nothing new to send. Tap × and ADD dishes for an add-on.',
    first: 'First order', addN: i => 'Add-on ' + i, wasSent: 'Was the order sent? Tap OK to mark it as sent.',
    toastSent: t => `Sent · ${t}`, toastClosed: t => `${t} closed`, confirmClose: t => `Close ${t}? Its sent orders will be cleared from this phone.`,
    // kitchen ticket
    TABLE: 'TABLE ', NEW: 'NEW ORDER', ADDON: 'ADD-ON', kWaiter: 'Waiter', kGuests: 'Guests', tableTotal: 'table total', BILL: 'BILL', total: 'Total',
    floors: { 'Ground Floor': 'Ground Floor', 'First Floor': 'First Floor', 'Hunter House': 'Hunter House' },
    extra: { Takeaway: 'Takeaway', Parcel: 'Parcel' }, locale: 'en-IN'
  },
  bn: {
    title: 'ফুড ভিলা · ওয়েটার', lgSent: 'অর্ডার পাঠানো হয়েছে (মোট বিল)', lgDraft: 'এখনও পাঠানো হয়নি', search: 'পদ খুঁজুন… যেমন chi, naan, momo',
    thisOrder: 'এই অর্ডার', guests: 'অতিথি', optional: 'ঐচ্ছিক', gnote: 'অর্ডার নোট', gnoteP: 'যেমন: আগে স্টার্টার দিন',
    addon: 'এই টেবিলের আগের অর্ডারে যোগ', addonS: 'রান্নাঘরে অতিরিক্ত আইটেম হিসেবে দেখাবে', send: 'রান্নাঘরে পাঠান',
    hint: 'শেয়ার মেনু খুলবে: হোয়াটসঅ্যাপ → রান্নাঘরের গ্রুপ বেছে নিন।', prev: 'এই টেবিলের আগে পাঠানো অর্ডার', soFar: 'এখন পর্যন্ত টেবিলের মোট',
    bill: 'বিলের হিসাব পাঠান', close: 'টেবিল বন্ধ (টাকা পাওয়া গেছে)', setName: 'আপনার নাম দিন', askName: 'আপনার নাম (রান্নাঘরে দেখাবে):',
    other: 'অন্যান্য', add: 'যোগ', note: 'নোট', noteP: 'রান্নাঘরের জন্য নোট', noMatch: q => `“${q}” নামে কোনো পদ নেই`,
    items: n => `${n}টি আইটেম`, tapAdd: 'পদের পাশে "যোগ" চাপুন', review: 'দেখুন ›', table: 'টেবিল ', waiter: 'ওয়েটার: ',
    noName: 'টেবিলের পাতায় 👤 চেপে নাম দিন', sentChip: 'পাঠানো ', nothing: 'নতুন কিছু পাঠানোর নেই। × চেপে আরও পদ যোগ করুন।',
    first: 'প্রথম অর্ডার', addN: i => 'অতিরিক্ত ' + i, wasSent: 'অর্ডার পাঠানো হয়েছে? হলে OK চাপুন।',
    toastSent: t => `পাঠানো হয়েছে · ${t}`, toastClosed: t => `${t} বন্ধ হয়েছে`, confirmClose: t => `${t} বন্ধ করবেন? এই ফোন থেকে এর অর্ডারগুলো মুছে যাবে।`,
    TABLE: 'টেবিল ', NEW: 'নতুন অর্ডার', ADDON: 'অতিরিক্ত অর্ডার', kWaiter: 'ওয়েটার', kGuests: 'অতিথি', tableTotal: 'টেবিলের মোট', BILL: 'বিল', total: 'মোট',
    floors: { 'Ground Floor': 'গ্রাউন্ড ফ্লোর', 'First Floor': 'ফার্স্ট ফ্লোর', 'Hunter House': 'হান্টার হাউস' },
    extra: { Takeaway: 'টেকঅ্যাওয়ে', Parcel: 'পার্সেল' }, locale: 'bn-IN'
  }
};
// Category and sub-heading names in Bengali (same as the website)
const CAT_BN = {
  "Starters": "স্টার্টার", "Kabab": "কাবাব", "Main Course": "মেইন কোর্স", "Biryani & Rice": "বিরিয়ানি ও রাইস",
  "Roti & Naan": "রুটি ও নান", "Noodles & Momo": "নুডলস ও মোমো", "Pizza & Burger": "পিৎজা ও বার্গার",
  "Pasta & Sizzler": "পাস্তা ও সিজলার", "Soup & Salad": "স্যুপ ও স্যালাড", "Rolls & Dosa": "রোল ও দোসা",
  "Beverages": "পানীয়", "Pure Veg": "পিওর ভেজ"
};
const SUB_BN = {
  "Non-veg": "আমিষ", "Veg": "নিরামিষ", "Chicken, Mutton & Fish": "চিকেন, মাটন ও মাছ", "Biryani": "বিরিয়ানি",
  "Rice": "রাইস", "Noodles": "নুডলস", "Momo": "মোমো", "Pizza": "পিৎজা", "Burger": "বার্গার", "Pasta": "পাস্তা",
  "Sizzler": "সিজলার", "Soup": "স্যুপ", "Salad": "স্যালাড", "Rolls": "রোল", "South Indian": "দক্ষিণ ভারতীয়",
  "No onion, no garlic": "পেঁয়াজ-রসুন ছাড়া"
};
let LANG = (() => { try { return localStorage.getItem('fvw-lang') || 'en'; } catch { return 'en'; } })();
const T = k => TXT[LANG][k];
const catName = c => LANG === 'bn' ? (CAT_BN[c] || c) : c;
const subName = s => LANG === 'bn' ? (SUB_BN[s] || s) : s;

// ===================== DATA =====================
const DISH = {}, ORDER = [];   // ORDER keeps menu order so kitchen tickets read top to bottom like the menu
Object.entries(MENU).forEach(([cat, rows]) => rows.forEach(r => {
  if (typeof r === 'string') return;
  const k = cat + '|' + r[0]; DISH[k] = { cat, name: r[0], price: r[1], veg: r[2] }; ORDER.push(k);
}));
const dup = new Set(Object.values(DISH).map(d => d.name).filter((n, i, a) => a.indexOf(n) !== i));
const NAMES_BN = typeof MENU_BN === 'object' ? MENU_BN : {};   // Bengali dish names from menu.js; English if missing
const dishName = n => LANG === 'bn' ? (NAMES_BN[n] || n) : n;
const label = d => dup.has(d.name) ? `${dishName(d.name)} (${catName(d.cat)})` : dishName(d.name);       // on screen
const labelBoth = d => (dup.has(d.name) ? `${d.name} (${d.cat})` : d.name) + (NAMES_BN[d.name] ? ` / ${NAMES_BN[d.name]}` : '');   // on tickets
const rs = n => '₹' + n.toLocaleString('en-IN');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const timeNow = (loc = T('locale')) => new Date().toLocaleTimeString(loc, { hour: 'numeric', minute: '2-digit' });
// Kitchen tickets: "English / বাংলা" labels, and quick notes in both languages ("Less spicy (কম ঝাল)")
const both = k => `${TXT.en[k]} / ${TXT.bn[k]}`;
const noteBoth = note => note.split(/\s*,\s*/).map(p => {
  const i = QUICK_NOTES.en.indexOf(p), j = QUICK_NOTES.bn.indexOf(p);
  return i >= 0 ? `${p} (${QUICK_NOTES.bn[i]})` : j >= 0 ? `${p} (${QUICK_NOTES.en[j]})` : p;
}).join(', ');

// Saved on this phone: waiter name, unsent drafts per table, and orders already sent per table
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let who = store.get('fvw-who', '');
let drafts = store.get('fvw-drafts', {});   // { table: { key: { q, note } } }
let sent = store.get('fvw-sent', {});       // { table: [ { at, time, lines: [[label, q, price, note]], total } ] }
// Sent orders are for today's service only: drop anything older than 16 hours
const fresh = Date.now() - 16 * 3600e3;
Object.keys(sent).forEach(t => { sent[t] = sent[t].filter(o => o.at > fresh); if (!sent[t].length) delete sent[t]; });
store.set('fvw-sent', sent);

let table = null;
const draft = () => (drafts[table] ||= {});
const saveDrafts = () => { Object.keys(drafts).forEach(t => { if (!Object.keys(drafts[t]).length) delete drafts[t]; }); store.set('fvw-drafts', drafts); };
const sentTotal = t => (sent[t] || []).reduce((a, o) => a + o.total, 0);

// ===================== SCREEN 1: TABLES =====================
const $ = id => document.getElementById(id);
function paintWho() { $('whoBtn').textContent = who ? '👤 ' + who : T('setName'); }
$('whoBtn').onclick = () => { const n = prompt(T('askName'), who); if (n !== null) { who = n.trim(); store.set('fvw-who', who); paintWho(); } };

// Switch language: fixed labels, then whatever screen is showing
function applyLang() {
  document.documentElement.lang = LANG;
  $('langBtn').textContent = LANG === 'bn' ? 'English' : 'বাংলা';
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = T(el.dataset.t));
  document.querySelectorAll('[data-tp]').forEach(el => el.placeholder = T(el.dataset.tp));
  $('today').textContent = new Date().toLocaleDateString(T('locale'), { weekday: 'long', day: 'numeric', month: 'short' });
  [...$('cats').children].forEach(b => b.textContent = catName(b.dataset.c));
  paintWho();
  if (table) { paintTitle(); paintList(); if (!$('sheet').hidden) openSheet(); } else paintTables();
}
$('langBtn').onclick = () => { LANG = LANG === 'bn' ? 'en' : 'bn'; try { localStorage.setItem('fvw-lang', LANG); } catch {} applyLang(); };

function tableBtn(t, text) {
  const n = Object.values(drafts[t] || {}).reduce((a, x) => a + x.q, 0), tot = sentTotal(t);
  return `<button class="tbl ${tot ? 'busy' : ''} ${n ? 'draft' : ''}" data-t="${esc(t)}" type="button">${esc(text)}${tot ? `<small>${rs(tot)}</small>` : ''}${n ? `<span class="dot">${n}</span>` : ''}</button>`;
}
function paintTables() {
  $('floors').innerHTML = FLOORS.map(f => `<div class="floor"><h2>${esc(T('floors')[f.name] || f.name)}</h2><div class="grid">${
    Array.from({ length: f.tables }, (_, i) => tableBtn(f.prefix + (i + 1), f.prefix + (i + 1))).join('')}</div></div>`).join('')
    + `<div class="floor"><h2>${T('other')}</h2><div class="grid" style="grid-template-columns:1fr 1fr">${EXTRA.map(t => tableBtn(t, T('extra')[t] || t)).join('')}</div></div>`;
}
$('floors').onclick = e => { const b = e.target.closest('.tbl'); if (b) openTable(b.dataset.t); };

// ===================== SCREEN 2: ORDER =====================
const cats = Object.keys(MENU);
$('cats').innerHTML = cats.map(c => `<button type="button" data-c="${esc(c)}">${esc(c)}</button>`).join('');
$('cats').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  $('q').value = ''; paintList();
  const sec = document.querySelector(`.sec[data-c="${CSS.escape(b.dataset.c)}"]`);
  if (sec) scrollTo({ top: scrollY + sec.getBoundingClientRect().top - document.querySelector('#vOrder .top').offsetHeight, behavior: 'instant' });
};

let openNote = null;   // key of the dish whose note box is open
function qtyCtl(k) {
  const q = draft()[k]?.q || 0;
  return `<span class="qty ${q ? '' : 'add'}"><button class="minus" type="button" data-k="${esc(k)}" data-d="-1" aria-label="Less">−</button><span class="q">${q}</span><button class="plus" type="button" data-k="${esc(k)}" data-d="1" aria-label="${q ? 'More' : 'Add'}">${q ? '+' : T('add')}</button></span>`;
}
function itemRow(k, showCat) {
  const d = DISH[k], o = draft()[k];
  return `<div class="it" data-k="${esc(k)}"><div class="row">
      <span class="nm"><span class="veg ${d.veg === 'n' ? 'nv' : ''}"></span>${esc(dishName(d.name))}<small>${rs(d.price)}${showCat ? ' · ' + esc(catName(d.cat)) : ''}</small></span>
      ${o ? `<button class="notebtn ${o.note ? 'has' : ''}" type="button" data-note="${esc(k)}">✎ ${T('note')}</button>` : ''}
      ${qtyCtl(k)}
    </div>
    ${o?.note && openNote !== k ? `<div class="shown-note">↳ ${esc(o.note)}</div>` : ''}
    ${openNote === k && o ? `<div class="note"><input data-ni="${esc(k)}" value="${esc(o.note || '')}" placeholder="${T('noteP')}"><div class="quick">${QUICK_NOTES[LANG].map(n => `<button type="button" data-qn="${esc(n)}" data-k="${esc(k)}">${n}</button>`).join('')}</div></div>` : ''}
  </div>`;
}
function paintList() {
  const q = $('q').value.trim().toLowerCase();
  if (q) {
    // Every word typed must appear in the dish name or category: "chi ric" → Chicken Fried Rice
    const words = q.split(/\s+/);
    const hits = ORDER.filter(k => { const s = (DISH[k].name + ' ' + (NAMES_BN[DISH[k].name] || '') + ' ' + DISH[k].cat + ' ' + (CAT_BN[DISH[k].cat] || '')).toLowerCase(); return words.every(w => s.includes(w)); });
    $('list').innerHTML = hits.length ? `<div class="sec">${hits.map(k => itemRow(k, true)).join('')}</div>` : `<p class="none">${T('noMatch')(esc(q))}</p>`;
  } else {
    $('list').innerHTML = cats.map(c => `<div class="sec" data-c="${esc(c)}"><h3>${esc(catName(c))}</h3>${
      MENU[c].map(r => typeof r === 'string' ? `<h4>${esc(subName(r.slice(2)))}</h4>` : itemRow(c + '|' + r[0], false)).join('')}</div>`).join('');
  }
  paintFoot();
}
function repaintItem(k) {
  const el = document.querySelector(`.it[data-k="${CSS.escape(k)}"]`);
  if (el) el.outerHTML = itemRow(k, !!$('q').value.trim());
  paintFoot();
}
function setQty(k, q) {
  if (q > 0) draft()[k] = { ...(draft()[k] || {}), q }; else { delete draft()[k]; if (openNote === k) openNote = null; }
  saveDrafts(); repaintItem(k);
}
$('list').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.d) { const k = b.dataset.k; setQty(k, (draft()[k]?.q || 0) + +b.dataset.d); return; }
  if (b.dataset.note) { const prev = openNote; openNote = openNote === b.dataset.note ? null : b.dataset.note; if (prev) repaintItem(prev); repaintItem(b.dataset.note); const i = document.querySelector(`[data-ni="${CSS.escape(b.dataset.note)}"]`); i?.focus(); return; }
  if (b.dataset.qn) { const o = draft()[b.dataset.k]; o.note = o.note ? (o.note.includes(b.dataset.qn) ? o.note : o.note + ', ' + b.dataset.qn) : b.dataset.qn; saveDrafts(); const k = openNote; openNote = null; repaintItem(k); }
});
$('list').addEventListener('input', e => { const k = e.target.dataset.ni; if (k && draft()[k]) { draft()[k].note = e.target.value; saveDrafts(); } });
$('list').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset.ni) { const k = openNote; openNote = null; repaintItem(k); } });
$('q').addEventListener('input', () => { openNote = null; paintList(); scrollTo({ top: 0, behavior: 'instant' }); });

function totals(t = table) { return Object.entries(drafts[t] || {}).reduce((a, [k, o]) => ({ n: a.n + o.q, sum: a.sum + o.q * DISH[k].price }), { n: 0, sum: 0 }); }
function paintFoot() {
  const { n, sum } = totals();
  $('foot').hidden = !table;
  $('goBtn').disabled = !n;
  $('goCount').textContent = n ? `${T('items')(n)} · ${rs(sum)}` : T('tapAdd');
  $('goTot').textContent = T('review');
}

const isTable = t => /^[A-Z]\d+$/.test(t);
const shortName = t => isTable(t) ? T('table') + t : (T('extra')[t] || t);      // on screen: "Table G5" / "টেবিল G5"
const tableName = (t, L = LANG) => isTable(t) ? TXT[L].TABLE + t : (TXT[L].extra[t] || t).toUpperCase();   // on tickets: "TABLE G5"
function paintTitle() {
  $('tblTitle').innerHTML = `${esc(shortName(table))}<small>${esc(who ? T('waiter') + who : T('noName'))}</small>`;
  const tot = sentTotal(table);
  $('tblInfo').hidden = !tot; $('tblInfo').textContent = T('sentChip') + rs(tot);
}
function openTable(t) {
  table = t; openNote = null;
  paintTitle();
  $('q').value = ''; paintList();
  $('vTables').hidden = true; $('vOrder').hidden = false; scrollTo(0, 0);
  history.pushState({ t }, '', '#' + encodeURIComponent(t));
}
function showTables() {
  table = null; $('sheet').hidden = true; $('vOrder').hidden = true; $('vTables').hidden = false; $('foot').hidden = true;
  paintTables(); scrollTo(0, 0);
}
$('backBtn').onclick = () => history.back();
addEventListener('popstate', () => { if ($('sheet').hidden === false) { $('sheet').hidden = true; if (table) history.pushState({ t: table }, '', '#' + encodeURIComponent(table)); return; } showTables(); });
$('tblInfo').onclick = () => openSheet();

// ===================== REVIEW + SEND =====================
const keysInOrder = (t = table) => ORDER.filter(k => drafts[t]?.[k]);
function openSheet() {
  const keys = keysInOrder(), { sum } = totals();
  $('shTitle').textContent = shortName(table);
  $('shLines').innerHTML = keys.length ? keys.map(k => { const o = drafts[table][k]; return `<div class="line"><span class="nm">${esc(label(DISH[k]))}${o.note ? `<small>↳ ${esc(o.note)}</small>` : ''}</span>${qtyCtl(k)}<span class="amt">${rs(o.q * DISH[k].price)}</span></div>`; }).join('')
    : `<p class="none" style="padding:20px 0">${T('nothing')}</p>`;
  $('shTot').textContent = rs(sum);
  $('newPart').hidden = !keys.length;
  const prev = sent[table] || [];
  $('addon').checked = prev.length > 0;
  $('prev').hidden = !prev.length;
  $('prevList').innerHTML = prev.map((o, i) => `<div class="p"><b>${o.no ? esc(o.no) : (i ? T('addN')(i) : T('first'))}</b> · ${o.time}${o.who ? ' · ' + esc(o.who) : ''} · ${rs(o.total)}<br>${o.lines.map(l => `${l[1]} × ${esc(l[0])}`).join(', ')}</div>`).join('');
  $('prevTot').textContent = rs(sentTotal(table));
  $('sheet').hidden = false;
}
$('goBtn').onclick = openSheet;
$('shClose').onclick = () => { $('sheet').hidden = true; };
$('sheet').onclick = e => { if (e.target === $('sheet')) $('sheet').hidden = true; };
$('shLines').addEventListener('click', e => {
  const b = e.target.closest('button[data-d]'); if (!b) return;
  const k = b.dataset.k, q = (draft()[k]?.q || 0) + +b.dataset.d;
  if (q > 0) draft()[k].q = q; else delete draft()[k];
  saveDrafts(); paintList(); openSheet();
});

// Share sheet (Android/iPhone) → WhatsApp → kitchen group. Fallback: copy + open a WhatsApp chat.
async function share(text) {
  if (navigator.share) {
    try { await navigator.share({ text }); return true; }
    catch (e) { if (e.name === 'AbortError') return false; }
  }
  try { await navigator.clipboard.writeText(text); } catch {}
  window.open(`https://wa.me/${KITCHEN_PHONE}?text=${encodeURIComponent(text)}`, '_blank', 'noopener');
  return confirm(T('wasSent'));
}

// Order numbers: WHERE-DDMM-WHO+COUNT, e.g. G5-0511-RA03 = table G5, 5 Nov, Raju's 3rd order today.
// Add-ons keep the table's number with -A1, -A2… so one visit = one number. Takeaway = TA, Parcel = PC.
const ddmm = () => { const d = new Date(); return String(d.getDate()).padStart(2, '0') + String(d.getMonth() + 1).padStart(2, '0'); };
const whoCode = () => { const lat = who.replace(/[^A-Za-z]/g, ''); return (lat ? lat.slice(0, 2) : Array.from(who.replace(/\s/g, '')).slice(0, 2).join('') || 'W').toUpperCase(); };
function newOrderNo(t) {   // returns the number and a commit() to call once it's really sent
  const day = ddmm(), c = store.get('fvw-count', {}), n = (c.day === day ? c.n : 0) + 1;
  const where = isTable(t) ? t : ({ Takeaway: 'TA', Parcel: 'PC' }[t] || t.slice(0, 2).toUpperCase());
  return { no: `${where}-${day}-${whoCode()}${String(n).padStart(2, '0')}`, commit: () => store.set('fvw-count', { day, n }) };
}

$('sendBtn').onclick = async () => {
  const keys = keysInOrder(); if (!keys.length) return;
  const { n, sum } = totals(), prev = sent[table] || [], addon = $('addon').checked && prev.length > 0;
  const guests = $('guests').value.trim(), gnote = $('gnote').value.trim();
  const last = prev[prev.length - 1], fresh = addon ? null : newOrderNo(table);
  const base = addon ? (last.base || last.no || '') : fresh.no;
  const no = addon ? `${base}-A${prev.filter(o => o.base === base).length}` : base;
  const head = L => `*${L === 'en' ? (addon ? '➕ ' : '🍽️ ') : ''}${tableName(table, L)} · ${addon ? TXT[L].ADDON + ' #' + prev.filter(o => o.base === base).length : TXT[L].NEW}*`;
  const msg = [
    head('en'), head('bn'), `*Order No. / অর্ডার নং: ${no}*`,
    [who && `${both('kWaiter')}: ${who}`, timeNow('en-IN'), guests && `${both('kGuests')}: ${guests}`].filter(Boolean).join(' · '),
    '',
    ...keys.flatMap(k => { const o = drafts[table][k]; return [`*${o.q} ×* ${labelBoth(DISH[k])}`, ...(o.note ? [`      ↳ _${noteBoth(o.note)}_`] : [])]; }),
    ...(gnote ? ['', `📝 ${gnote}`] : []),
    '',
    `${TXT.en.items(n)} / ${TXT.bn.items(n)} · ${rs(sum)}${prev.length ? `  (${both('tableTotal')} ${rs(sentTotal(table) + sum)})` : ''}`
  ].join('\n');
  if (!(await share(msg))) return;
  fresh?.commit();
  (sent[table] ||= []).push({ no, base, at: Date.now(), time: timeNow(), who, total: sum, lines: keys.map(k => [labelBoth(DISH[k]), drafts[table][k].q, DISH[k].price, drafts[table][k].note || '']) });
  store.set('fvw-sent', sent);
  const t = table; delete drafts[table]; saveDrafts();
  $('guests').value = ''; $('gnote').value = '';
  toast(T('toastSent')(`${shortName(t)} · ${no}`));
  $('sheet').hidden = true; history.back();
};

// Whole table on one message, for the counter to make the bill
$('billBtn').onclick = async () => {
  const all = {};
  (sent[table] || []).forEach(o => o.lines.forEach(([nm, q, p]) => { all[nm] ||= { q: 0, p }; all[nm].q += q; }));
  const nos = [...new Set((sent[table] || []).map(o => o.base).filter(Boolean))];
  const msg = [`*🧾 ${TXT.en.BILL} · ${tableName(table, 'en')}*`, `*${TXT.bn.BILL} · ${tableName(table, 'bn')}*`,
    ...(nos.length ? [`*Order No. / অর্ডার নং: ${nos.join(', ')}*`] : []), timeNow('en-IN') + (who ? ` · ${who}` : ''), '',
    ...Object.entries(all).map(([nm, o]) => `${o.q} × ${nm} = ${rs(o.q * o.p)}`), '', `*${both('total')}: ${rs(sentTotal(table))}*`].join('\n');
  await share(msg);
};
$('closeBtn').onclick = () => {
  if (!confirm(T('confirmClose')(shortName(table)))) return;
  delete sent[table]; delete drafts[table]; store.set('fvw-sent', sent); saveDrafts();
  toast(T('toastClosed')(shortName(table))); $('sheet').hidden = true; history.back();
};

function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => el.hidden = true, 2200); }

applyLang();
history.replaceState({}, '', location.pathname);
if (!who) setTimeout(() => $('whoBtn').click(), 300);
</script>
</body>
</html>
